# PR08 AMCL localization profile.
#
# NOTE: the weekly course kit (.course-kit/v1/fixtures/pr08/amcl.yaml) was
# not available in this environment, so this profile is a reconstruction
# following the PR08 contract: node keys map_server / amcl /
# lifecycle_manager_localization, initial pose (0, 0, 0), base_frame_id
# base_link, autostart: true, node_names: [map_server, amcl].
# REPLACE with the kit profile when available and keep the key names.
# The defect copy (amcl-defect.yaml) differs from this file ONLY in
# base_frame_id.

amcl:
  ros__parameters:
    use_sim_time: true
    # frames: AMCL publishes map -> odom and must not republish
    # odom -> base_link (owned by the PR07 odometry adapter in the bag)
    # or the static base_link -> lidar_link (owned by robot_state_publisher).
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    # inputs: PR07 recording contract
    scan_topic: /vehicle/scan
    map_topic: /map
    # initial pose from the PR08 assignment: (x=0, y=0, yaw=0)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # particle filter
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    odom_model_type: diff
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    pf_err: 0.05
    pf_eps: 0.01
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename is set by localization.launch.py from the map argument.
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - map_server
      - amcl
