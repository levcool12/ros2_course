# PR08 stage 2 (defect): copy of amcl.yaml with ONE changed line.
# base_frame_id: base_link -> chassis. "chassis" is a frame nobody
# publishes, so AMCL cannot look up odom -> chassis: it stops producing
# map -> odom and tf2 lookups fail. DO NOT use for the passing run;
# the corrected profile is amcl.yaml.

amcl:
  ros__parameters:
    use_sim_time: true
    # DEFECT: base_frame_id names a missing frame (correct: base_link).
    base_frame_id: chassis
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /vehicle/scan
    map_topic: /map
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    odom_model_type: diff
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    pf_err: 0.05
    pf_eps: 0.01
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - map_server
      - amcl
