name: ros2_ci

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep
          sudo rosdep init || true
          rosdep update

      - name: Resolve package dependencies with rosdep
        run: |
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy || true

      - name: Run Colcon Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Run Colcon Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test
          colcon test-result --verbose

      - name: Run Practice Checker
        run: |
          source /opt/ros/jazzy/setup.bash
          if [ -f .course-kit/v1/tools/check_practice.py ]; then
            for pr in PR01 PR02 PR03 PR04 PR05 PR06 PR07; do
              python3 .course-kit/v1/tools/check_practice.py "$pr" --submission . || true
            done
          else
            echo "Course kit checker skipped or not present in root."
          fi
